apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: csi-nfs
spec:
  interval: 30m
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.5"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    feature:
      enableFSGroupPolicy: false
      propagateHostMountOptions: false
    controller:
      enableSnapshotter: false
    externalSnapshotter:
      enabled: false
