kind: HelmRelease
spec:
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.5"
  install:
    remediation: { retries: 3}
  upgrade:
    remediation: { retries: 3}
  values:
    feature:
      enableFSGroupPolicy: false
      propagateHostMountOptions: false
    controller:
      enableSnapshotter: false
    externalSnapshotter:
      enabled: false
