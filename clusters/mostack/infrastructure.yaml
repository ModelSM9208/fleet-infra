apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  path: ./infrastructure/controllers/gateway-api
  prune: false                  # deleting CRDs deletes every Gateway and Route
  wait: true                    # Ready only once the CRDs are established
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api
  interval: 30m
  timeout: 10m
  path: ./infrastructure/controllers/cilium
  prune: true
  wait: true                    # Ready only when the HelmRelease is Ready
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-driver-nfs
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/controllers/csi-driver-nfs
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  dependsOn:
    - name: csi-driver-nfs
  interval: 30m
  path: ./infrastructure/configs/storage
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: intel-gpu-plugin
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/controllers/intel-gpu-plugin
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
